<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Email Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Spam Email Classifier</h1>
            <p>Determine whether an email is spam or ham using Machine Learning.</p>
        </header>

        <main>
            <form id="classificationForm">
                <div class="form-group">
                    <label for="emailText">Email Content:</label>
                    <textarea id="emailText" name="emailText" rows="10" placeholder="Paste the email content here..." required></textarea>
                </div>
                <button type="submit" id="submitBtn">
                    <span id="btnText">Classify Email</span>
                    <span id="loader" class="hidden"></span>
                </button>
            </form>

            <div id="resultBox" class="result-box hidden">
                <h2>Result</h2>
                <div id="resultContent" class="result-content"></div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 Spam Email Classifier Project</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
